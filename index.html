<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
        <meta charset="utf-8">
        <title>Presenter</title>
    </head>
    <body>
        <script type="module">
            import {ProgramState} from "./renkon-core.js";
            import {CodeMirror} from "./renkon-codemirror.js";
            window.CodeMirror = CodeMirror;
            const programState = new ProgramState(Date.now());
            const mod = programState.loadTS("presenter.ts");
            mod.then((loaded) => {
              programState.merge(loaded.initialization, loaded.newEditorNodes, loaded.rendering, loaded.scroll, loaded.separator, loaded.css, loaded.saveAndLoad);
              programState.start();
            });
        </script>
    </body>
</html>
